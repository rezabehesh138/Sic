<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انبار مجازی ایمپلنت SIC</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    color: #1f2937;
    font-family: Tahoma, Arial, sans-serif;
}

.container {
    max-width: 1150px;
    margin: auto;
    padding: 18px;
}

/* ================= HEADER ================= */

.header {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.03);
}

.header h1 {
    margin: 0 0 6px;
    font-size: 22px;
}

.header p {
    margin: 0;
    font-size: 12px;
    color: #6b7280;
}

.header-info {
    text-align: left;
    font-size: 11px;
    color: #6b7280;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f0fdf4;
    color: #15803d;
    padding: 6px 10px;
    border-radius: 20px;
    margin-bottom: 6px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
}

/* ================= SUMMARY ================= */

.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}

.summary-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 11px;
    text-align: center;
}

.summary-label {
    font-size: 10px;
    color: #6b7280;
    margin-bottom: 5px;
}

.summary-value {
    font-size: 19px;
    font-weight: bold;
}

/* ================= CONTROLS ================= */

.controls {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

.search {
    flex: 1;
}

.search input,
select,
button {
    height: 36px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 11px;
}

.search input {
    width: 100%;
    border: 1px solid #d1d5db;
    padding: 0 10px;
    outline: none;
}

select {
    border: 1px solid #d1d5db;
    background: white;
    padding: 0 9px;
}

button {
    border: none;
    padding: 0 14px;
    cursor: pointer;
}

.btn-dark {
    background: #111827;
    color: white;
}

.btn-light {
    background: #f3f4f6;
    color: #374151;
}

/* ================= LINE ================= */

.line-section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 13px;
    box-shadow: 0 2px 7px rgba(0,0,0,.025);
}

.line-header {
    height: 46px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e7eb;
}

.line-title {
    display: flex;
    align-items: center;
    gap: 8px;
}

.line-title h2 {
    margin: 0;
    font-size: 15px;
}

.line-badge {
    background: #f3f4f6;
    color: #6b7280;
    border-radius: 15px;
    padding: 4px 8px;
    font-size: 9px;
}

.line-total {
    font-size: 11px;
    color: #6b7280;
}

.line-total strong {
    color: #111827;
    font-size: 14px;
}

/* ================= TABLE ================= */

/*
   جهت جدول LTR شده تا طول‌ها از چپ به راست
   به ترتیب کوچک به بزرگ قرار بگیرند.
*/

.table-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}

.inventory-table {
    width: 100%;
    min-width: 680px;
    border-collapse: collapse;
    direction: ltr;
    table-layout: fixed;
}

.inventory-table th,
.inventory-table td {
    border-right: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

.inventory-table tr:last-child td {
    border-bottom: none;
}

.inventory-table th:last-child,
.inventory-table td:last-child {
    border-right: none;
}

.inventory-table thead th {
    height: 35px;
    background: #f9fafb;
    font-size: 10px;
    color: #374151;
}

.diameter-header {
    width: 105px;
    background: #f3f4f6 !important;
}

.diameter-cell {
    width: 105px;
    height: 52px;
    background: #fafafa;
    font-size: 11px;
    font-weight: bold;
    color: #374151;
}

/* ================= STOCK CELL ================= */

.inventory-cell {
    height: 52px;
    min-width: 110px;
    cursor: pointer;
    position: relative;
    transition: box-shadow .12s, opacity .15s;
}

.inventory-cell:hover {
    box-shadow: inset 0 0 0 2px #6b7280;
    z-index: 2;
}

.stock-number {
    font-size: 17px;
    font-weight: bold;
    color: #111827;
    line-height: 1;
}

.stock-label {
    font-size: 8px;
    color: #6b7280;
    margin-top: 3px;
}

/* رنگ موجودی */

.stock-zero {
    background: #fff;
}

.stock-low {
    background: #fecaca;
}

.stock-orange {
    background: #fed7aa;
}

.stock-medium {
    background: #fef08a;
}

.stock-good {
    background: #bbf7d0;
}

/* ================= DIRECT EDIT ================= */

.stock-input {
    width: 58px;
    height: 30px;
    border: 1px solid #6b7280;
    border-radius: 5px;
    text-align: center;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    outline: none;
    background: #fff;
}

.edit-hint {
    font-size: 7px;
    color: #6b7280;
    margin-top: 2px;
}

/* ================= LEGEND ================= */

.legend {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 9px;
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: #4b5563;
}

.legend-color {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.08);
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 9px;
    padding: 8px;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .container {
        padding: 9px;
    }

    .header {
        padding: 14px;
        align-items: flex-start;
    }

    .header h1 {
        font-size: 18px;
    }

    .header-info {
        text-align: left;
        font-size: 9px;
    }

    .summary {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }

    .summary-card {
        padding: 8px 4px;
    }

    .summary-value {
        font-size: 16px;
    }

    .controls {
        flex-wrap: wrap;
    }

    .search {
        flex-basis: 100%;
    }

    .controls select,
    .controls button {
        flex: 1;
    }

    /*
       جدول عمداً عرض کامل موبایل را مجبور نمی‌کند.
       فقط خود جدول اسکرول افقی می‌گیرد.
    */

    .table-scroll {
        overflow-x: auto;
    }

    .inventory-table {
        min-width: 680px;
    }

    .line-header {
        padding: 0 10px;
    }

    .line-title h2 {
        font-size: 13px;
    }

    .line-badge {
        display: none;
    }

    .line-total {
        font-size: 9px;
    }

    .legend {
        gap: 9px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="header">

        <div>
            <h1>انبار مجازی ایمپلنت SIC</h1>
            <p>مدیریت و پایش موجودی ایمپلنت‌ها</p>
        </div>

        <div class="header-info">

            <div class="status">
                <span class="status-dot"></span>
                حالت محلی
            </div>

            <div>
                آخرین به‌روزرسانی:
                <strong id="lastUpdate">
                    هنوز ثبت نشده
                </strong>
            </div>

        </div>

    </header>


    <!-- SUMMARY -->

    <section class="summary">

        <div class="summary-card">
            <div class="summary-label">مجموع موجودی</div>
            <div class="summary-value" id="totalStock">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">ACE</div>
            <div class="summary-value" id="aceTotal">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">MAX</div>
            <div class="summary-value" id="maxTotal">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">Tapered</div>
            <div class="summary-value" id="taperedTotal">0</div>
        </div>

        <div class="summary-card">
            <div class="summary-label">زیر 10 عدد</div>
            <div class="summary-value" id="lowStockCount">0</div>
        </div>

    </section>


    <!-- CONTROLS -->

    <section class="controls">

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="جستجو: لاین، قطر یا طول..."
                oninput="applyFilters()"
            >
        </div>

        <select id="filterSelect" onchange="applyFilters()">

            <option value="all">همه</option>

            <option value="available">
                موجود
            </option>

            <option value="zero">
                صفر
            </option>

            <option value="low">
                کمتر از 10
            </option>

            <option value="orange">
                10 تا 20
            </option>

            <option value="medium">
                21 تا 30
            </option>

            <option value="good">
                بیشتر از 30
            </option>

        </select>

        <button
            class="btn-light"
            onclick="resetFilters()"
        >
            پاک کردن
        </button>

        <button
            class="btn-dark"
            onclick="saveChanges()"
        >
            ذخیره
        </button>

    </section>


    <!-- LEGEND -->

    <div class="legend">

        <div class="legend-item">
            <span class="legend-color stock-zero"></span>
            0
        </div>

        <div class="legend-item">
            <span class="legend-color stock-low"></span>
            1 تا 9
        </div>

        <div class="legend-item">
            <span class="legend-color stock-orange"></span>
            10 تا 20
        </div>

        <div class="legend-item">
            <span class="legend-color stock-medium"></span>
            21 تا 30
        </div>

        <div class="legend-item">
            <span class="legend-color stock-good"></span>
            بیشتر از 30
        </div>

    </div>


    <!-- TABLES -->

    <div id="tablesContainer"></div>


    <div class="footer">
        انبار مجازی SIC
    </div>

</div>


<script>

/* =========================================================
   DATA
   ========================================================= */

const inventory = {

    ACE: {
        diameters: [3.4, 4.0, 4.5, 5.0],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    },

    MAX: {
        diameters: [3.7, 4.2, 4.7, 5.2],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    },

    Tapered: {
        diameters: [3.7, 4.2, 4.7, 5.2],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    }

};


/* سلول در حال ویرایش */
let editingCell = null;


/* =========================================================
   INITIALIZE
   ========================================================= */

function initializeInventory() {

    Object.keys(inventory).forEach(line => {

        inventory[line].diameters.forEach(diameter => {

            inventory[line].lengths.forEach(length => {

                const key =
                    createKey(line, diameter, length);

                inventory[line].stock[key] = 0;

            });

        });

    });

}


/* =========================================================
   KEY
   ========================================================= */

function createKey(line, diameter, length) {

    return `${line}_${diameter}_${length}`;

}


/* =========================================================
   STOCK COLOR
   ========================================================= */

function getStockClass(stock) {

    if (stock === 0) {
        return "stock-zero";
    }

    if (stock < 10) {
        return "stock-low";
    }

    if (stock <= 20) {
        return "stock-orange";
    }

    if (stock <= 30) {
        return "stock-medium";
    }

    return "stock-good";

}


/* =========================================================
   RENDER TABLES
   ========================================================= */

function renderTables() {

    const container =
        document.getElementById("tablesContainer");

    container.innerHTML = "";

    Object.keys(inventory).forEach(line => {

        const data = inventory[line];

        const section =
            document.createElement("section");

        section.className = "line-section";

        section.dataset.line = line;

        let rows = "";

        data.diameters.forEach(diameter => {

            let cells = "";

            data.lengths.forEach(length => {

                const key =
                    createKey(line, diameter, length);

                const stock =
                    data.stock[key];

                cells += `

                    <td
                        class="inventory-cell ${getStockClass(stock)}"
                        data-line="${line}"
                        data-diameter="${diameter}"
                        data-length="${length}"
                        data-stock="${stock}"
                        data-search="${line} ${diameter} ${length}"
                        onclick="startEdit(this)"
                    >

                        <div class="stock-number">
                            ${stock}
                        </div>

                        <div class="stock-label">
                            عدد
                        </div>

                    </td>

                `;

            });

            rows += `

                <tr>

                    <td class="diameter-cell">
                        ${diameter}
                    </td>

                    ${cells}

                </tr>

            `;

        });


        section.innerHTML = `

            <div class="line-header">

                <div class="line-title">

                    <h2>${line}</h2>

                    <span class="line-badge">
                        4 قطر × 5 طول
                    </span>

                </div>

                <div class="line-total">

                    مجموع:
                    <strong id="${line}-total">
                        0
                    </strong>
                    عدد

                </div>

            </div>


            <div class="table-scroll">

                <table class="inventory-table">

                    <thead>

                        <tr>

                            <th class="diameter-header">
                                قطر / طول
                            </th>

                            ${data.lengths.map(length => `

                                <th>
                                    ${length}
                                </th>

                            `).join("")}

                        </tr>

                    </thead>

                    <tbody>
                        ${rows}
                    </tbody>

                </table>

            </div>
        `;

        container.appendChild(section);

    });

}


/* =========================================================
   DIRECT EDIT
   ========================================================= */

function startEdit(cell) {

    if (editingCell) {
        finishEdit();
    }

    editingCell = cell;

    const oldValue =
        Number(cell.dataset.stock);

    cell.innerHTML = `

        <input
            class="stock-input"
            type="number"
            min="0"
            step="1"
            value="${oldValue}"
        >

        <div class="edit-hint">
            Enter = ثبت
        </div>

    `;

    const input =
        cell.querySelector("input");

    input.focus();

    input.select();


    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            finishEdit();

        }

        if (event.key === "Escape") {

            cancelEdit();

        }

    });


    input.addEventListener("blur", function() {

        setTimeout(() => {

            if (editingCell === cell) {
                finishEdit();
            }

        }, 100);

    });

}


/* =========================================================
   FINISH EDIT
   ========================================================= */

function finishEdit() {

    if (!editingCell) {
        return;
    }

    const cell =
        editingCell;

    const input =
        cell.querySelector("input");

    if (!input) {
        editingCell = null;
        return;
    }

    let value =
        Number(input.value);

    if (!Number.isInteger(value) || value < 0) {

        value = 0;

    }

    const line =
        cell.dataset.line;

    const diameter =
        Number(cell.dataset.diameter);

    const length =
        Number(cell.dataset.length);

    const key =
        createKey(line, diameter, length);

    inventory[line].stock[key] =
        value;

    cell.dataset.stock =
        value;

    cell.className =
        `inventory-cell ${getStockClass(value)}`;

    cell.innerHTML = `

        <div class="stock-number">
            ${value}
        </div>

        <div class="stock-label">
            عدد
        </div>

    `;

    editingCell = null;

    updateSummary();

    updateLastUpdate();

}


/* =========================================================
   CANCEL EDIT
   ========================================================= */

function cancelEdit() {

    if (!editingCell) {
        return;
    }

    const cell =
        editingCell;

    const value =
        Number(cell.dataset.stock);

    cell.className =
        `inventory-cell ${getStockClass(value)}`;

    cell.innerHTML = `

        <div class="stock-number">
            ${value}
        </div>

        <div class="stock-label">
            عدد
        </div>

    `;

    editingCell = null;

}


/* =========================================================
   SUMMARY
   ========================================================= */

function updateSummary() {

    let total = 0;

    let lowCount = 0;

    Object.keys(inventory).forEach(line => {

        let lineTotal = 0;

        Object.values(inventory[line].stock)
            .forEach(stock => {

                lineTotal += stock;

                total += stock;

                if (stock > 0 && stock < 10) {
                    lowCount++;
                }

            });


        document.getElementById(
            `${line}-total`
        ).textContent =
            lineTotal.toLocaleString("fa-IR");


        document.getElementById(
            line.toLowerCase() + "Total"
        ).textContent =
            lineTotal.toLocaleString("fa-IR");

    });


    document.getElementById("totalStock")
        .textContent =
        total.toLocaleString("fa-IR");


    document.getElementById("lowStockCount")
        .textContent =
        lowCount.toLocaleString("fa-IR");

}


/* =========================================================
   LAST UPDATE
   ========================================================= */

function updateLastUpdate() {

    const now =
        new Date();

    const date =
        now.toLocaleDateString("fa-IR");

    const time =
        now.toLocaleTimeString("fa-IR", {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("lastUpdate")
        .textContent =
        `${date} - ${time}`;

}


/* =========================================================
   FILTER
   ========================================================= */

function applyFilters() {

    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filter =
        document.getElementById("filterSelect")
        .value;


    document.querySelectorAll(".inventory-cell")
        .forEach(cell => {

            const line =
                cell.dataset.line;

            const diameter =
                Number(cell.dataset.diameter);

            const length =
                Number(cell.dataset.length);

            const stock =
                Number(cell.dataset.stock);


            const text =
                `${line} ${diameter} ${length}`
                .toLowerCase();


            const searchMatch =
                !search ||
                text.includes(search);


            let filterMatch = true;


            if (filter === "available") {
                filterMatch = stock > 0;
            }

            else if (filter === "zero") {
                filterMatch = stock === 0;
            }

            else if (filter === "low") {
                filterMatch =
                    stock > 0 && stock < 10;
            }

            else if (filter === "orange") {
                filterMatch =
                    stock >= 10 && stock <= 20;
            }

            else if (filter === "medium") {
                filterMatch =
                    stock >= 21 && stock <= 30;
            }

            else if (filter === "good") {
                filterMatch =
                    stock > 30;
            }


            cell.style.opacity =
                searchMatch && filterMatch
                    ? "1"
                    : "0.15";

        });

}


/* =========================================================
   RESET FILTER
   ========================================================= */

function resetFilters() {

    document.getElementById("searchInput")
        .value = "";

    document.getElementById("filterSelect")
        .value = "all";


    document.querySelectorAll(".inventory-cell")
        .forEach(cell => {

            cell.style.opacity = "1";

        });

}


/* =========================================================
   SAVE
   ========================================================= */

function saveChanges() {

    /*
       این قسمت فعلاً محلی است.

       در مرحله اتصال به Supabase:
       فقط داده‌های تغییرکرده از اینجا
       به دیتابیس ارسال خواهند شد.
    */

    updateLastUpdate();

    alert(
        "تغییرات در نسخه محلی ثبت شد.\n\n" +
        "اتصال به Supabase در مرحله بعد اضافه می‌شود."
    );

}


/* =========================================================
   START
   ========================================================= */

initializeInventory();

renderTables();

updateSummary();

</script>

</body>
</html>
