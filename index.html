<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انبار مجازی ایمپلنت SIC</title>
 
<style>
* {
    box-sizing: border-box;
}
 
body {
    margin: 0;
    background: #f5f7fa;
    color: #1f2937;
    font-family: Tahoma, Arial, sans-serif;
}
 
.container {
    max-width: 1150px;
    margin: auto;
    padding: 18px;
}
 
/* ================= HEADER ================= */
 
.header {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.03);
    flex-wrap: wrap;
    gap: 10px;
}
 
.header h1 {
    margin: 0 0 6px;
    font-size: 22px;
}
 
.header p {
    margin: 0;
    font-size: 12px;
    color: #6b7280;
}
 
.header-info {
    text-align: left;
    font-size: 11px;
    color: #6b7280;
}
 
.status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #f0fdf4;
    color: #15803d;
    padding: 6px 10px;
    border-radius: 20px;
    margin-bottom: 6px;
}
 
.status.connecting {
    background: #fef9c3;
    color: #854d0e;
}
 
.status.error {
    background: #fee2e2;
    color: #b91c1c;
}
 
.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
}
 
.status.connecting .status-dot {
    background: #eab308;
}
 
.status.error .status-dot {
    background: #ef4444;
}
 
/* ================= SUMMARY ================= */
 
.summary {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 14px;
}
 
.summary-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 11px;
    text-align: center;
}
 
.summary-label {
    font-size: 10px;
    color: #6b7280;
    margin-bottom: 5px;
}
 
.summary-value {
    font-size: 19px;
    font-weight: bold;
}
 
/* ================= CONTROLS ================= */
 
.controls {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 10px;
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}
 
.search {
    flex: 1;
    min-width: 150px;
}
 
.search input,
select,
button {
    height: 36px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 11px;
}
 
.search input {
    width: 100%;
    border: 1px solid #d1d5db;
    padding: 0 10px;
    outline: none;
}
 
select {
    border: 1px solid #d1d5db;
    background: white;
    padding: 0 9px;
}
 
button {
    border: none;
    padding: 0 14px;
    cursor: pointer;
}
 
.btn-dark {
    background: #111827;
    color: white;
}
 
.btn-dark:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}
 
.btn-light {
    background: #f3f4f6;
    color: #374151;
}
 
.btn-green {
    background: #15803d;
    color: white;
}
 
.btn-green:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}
 
/* ================= LINE ================= */
 
.line-section {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 13px;
    box-shadow: 0 2px 7px rgba(0,0,0,.025);
}
 
.line-header {
    height: 46px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e5e7eb;
}
 
.line-title {
    display: flex;
    align-items: center;
    gap: 8px;
}
 
.line-title h2 {
    margin: 0;
    font-size: 15px;
}
 
.line-badge {
    background: #f3f4f6;
    color: #6b7280;
    border-radius: 15px;
    padding: 4px 8px;
    font-size: 9px;
}
 
.line-total {
    font-size: 11px;
    color: #6b7280;
}
 
.line-total strong {
    color: #111827;
    font-size: 14px;
}
 
/* ================= TABLE ================= */
 
/*
   جهت جدول LTR شده تا طول‌ها از چپ به راست
   به ترتیب کوچک به بزرگ قرار بگیرند.
*/
 
.table-scroll {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
}
 
.inventory-table {
    width: 100%;
    min-width: 680px;
    border-collapse: collapse;
    direction: ltr;
    table-layout: fixed;
}
 
.inventory-table th,
.inventory-table td {
    border-right: 1px solid #e5e7eb;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}
 
.inventory-table tr:last-child td {
    border-bottom: none;
}
 
.inventory-table th:last-child,
.inventory-table td:last-child {
    border-right: none;
}
 
.inventory-table thead th {
    height: 35px;
    background: #f9fafb;
    font-size: 10px;
    color: #374151;
}
 
.diameter-header {
    width: 105px;
    background: #f3f4f6 !important;
}
 
.diameter-cell {
    width: 105px;
    height: 52px;
    background: #fafafa;
    font-size: 11px;
    font-weight: bold;
    color: #374151;
}
 
/* ================= STOCK CELL ================= */
 
.inventory-cell {
    height: 52px;
    min-width: 110px;
    cursor: pointer;
    position: relative;
    transition: box-shadow .12s, opacity .15s;
}
 
.inventory-cell:hover {
    box-shadow: inset 0 0 0 2px #6b7280;
    z-index: 2;
}
 
.stock-number {
    font-size: 17px;
    font-weight: bold;
    color: #111827;
    line-height: 1;
}
 
.stock-label {
    font-size: 8px;
    color: #6b7280;
    margin-top: 3px;
}
 
/* رنگ موجودی */
 
.stock-zero {
    background: #fff;
}
 
.stock-low {
    background: #fecaca;
}
 
.stock-orange {
    background: #fed7aa;
}
 
.stock-medium {
    background: #fef08a;
}
 
.stock-good {
    background: #bbf7d0;
}
 
/* سلول بدون کد کالا */
 
.stock-nocode {
    background: repeating-linear-gradient(
        45deg,
        #f3f4f6,
        #f3f4f6 6px,
        #e5e7eb 6px,
        #e5e7eb 12px
    );
    cursor: default;
    min-width: 110px;
    height: 52px;
}
 
.stock-nocode:hover {
    box-shadow: none;
}
 
.nocode-label {
    font-size: 9px;
    color: #9ca3af;
}
 
/* ================= DIRECT EDIT ================= */
 
.stock-input {
    width: 58px;
    height: 30px;
    border: 1px solid #6b7280;
    border-radius: 5px;
    text-align: center;
    font-family: inherit;
    font-size: 15px;
    font-weight: bold;
    outline: none;
    background: #fff;
}
 
.edit-hint {
    font-size: 7px;
    color: #6b7280;
    margin-top: 2px;
}
 
/* ================= LEGEND ================= */
 
.legend {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 9px;
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}
 
.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9px;
    color: #4b5563;
}
 
.legend-color {
    width: 13px;
    height: 13px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.08);
}
 
/* ================= FOOTER ================= */
 
.footer {
    text-align: center;
    color: #9ca3af;
    font-size: 9px;
    padding: 8px;
}
 
/* ================= MOBILE ================= */
 
@media (max-width: 700px) {
 
    .container {
        padding: 9px;
    }
 
    .header {
        padding: 14px;
        align-items: flex-start;
    }
 
    .header h1 {
        font-size: 18px;
    }
 
    .header-info {
        text-align: left;
        font-size: 9px;
    }
 
    .summary {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }
 
    .summary-card {
        padding: 8px 4px;
    }
 
    .summary-value {
        font-size: 16px;
    }
 
    .controls {
        flex-wrap: wrap;
    }
 
    .search {
        flex-basis: 100%;
    }
 
    .controls select,
    .controls button {
        flex: 1;
        min-width: 90px;
    }
 
    /*
       روی موبایل جدول باید کامل و بدون اسکرول افقی دیده شود،
       پس عرض ثابت و اسکرول برداشته می‌شود و ستون‌ها
       با table-layout: fixed به‌صورت درصدی تقسیم می‌شوند.
    */
 
    .table-scroll {
        overflow-x: hidden;
    }
 
    .inventory-table {
        min-width: 0;
        table-layout: fixed;
    }
 
    .diameter-header,
    .diameter-cell {
        width: 17%;
        padding: 0 2px;
    }
 
    .inventory-table thead th {
        height: 28px;
        font-size: 8.5px;
        padding: 0 1px;
    }
 
    .diameter-cell {
        height: 42px;
        font-size: 10px;
    }
 
    .inventory-cell,
    .stock-nocode {
        height: 42px;
        min-width: 0;
    }
 
    .stock-number {
        font-size: 14px;
    }
 
    .stock-label {
        font-size: 6.5px;
        margin-top: 1px;
    }
 
    .nocode-label {
        font-size: 7.5px;
    }
 
    .line-header {
        padding: 0 10px;
    }
 
    .line-title h2 {
        font-size: 13px;
    }
 
    .line-badge {
        display: none;
    }
 
    .line-total {
        font-size: 9px;
    }
 
    .legend {
        gap: 9px;
    }
}
</style>
</head>
 
<body>
 
<div class="container">
 
    <!-- HEADER -->
 
    <header class="header">
 
        <div>
            <h1>انبار مجازی ایمپلنت SIC</h1>
            <p>مدیریت و پایش موجودی ایمپلنت‌ها</p>
        </div>
 
        <div class="header-info">
 
            <div class="status connecting" id="connectionStatus">
                <span class="status-dot"></span>
                <span id="connectionStatusText">در حال اتصال...</span>
            </div>
 
            <div>
                آخرین به‌روزرسانی:
                <strong id="lastUpdate">
                    هنوز ثبت نشده
                </strong>
            </div>
 
        </div>
 
    </header>
 
 
    <!-- SUMMARY -->
 
    <section class="summary">
 
        <div class="summary-card">
            <div class="summary-label">مجموع موجودی</div>
            <div class="summary-value" id="totalStock">0</div>
        </div>
 
        <div class="summary-card">
            <div class="summary-label">ACE</div>
            <div class="summary-value" id="aceTotal">0</div>
        </div>
 
        <div class="summary-card">
            <div class="summary-label">MAX</div>
            <div class="summary-value" id="maxTotal">0</div>
        </div>
 
        <div class="summary-card">
            <div class="summary-label">Tapered</div>
            <div class="summary-value" id="taperedTotal">0</div>
        </div>
 
        <div class="summary-card">
            <div class="summary-label">زیر 10 عدد</div>
            <div class="summary-value" id="lowStockCount">0</div>
        </div>
 
    </section>
 
 
    <!-- CONTROLS -->
 
    <section class="controls">
 
        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="جستجو: لاین، قطر یا طول..."
                oninput="applyFilters()"
            >
        </div>
 
        <select id="filterSelect" onchange="applyFilters()">
 
            <option value="all">همه</option>
 
            <option value="available">
                موجود
            </option>
 
            <option value="zero">
                صفر
            </option>
 
            <option value="low">
                کمتر از 10
            </option>
 
            <option value="orange">
                10 تا 20
            </option>
 
            <option value="medium">
                21 تا 30
            </option>
 
            <option value="good">
                بیشتر از 30
            </option>
 
        </select>
 
        <button
            class="btn-light"
            onclick="resetFilters()"
        >
            پاک کردن
        </button>
 
        <input
            type="file"
            id="excelInput"
            accept=".xlsx,.xls"
            style="display:none"
            onchange="handleExcelFile(event)"
        >
 
        <button
            class="btn-green"
            id="uploadBtn"
            onclick="document.getElementById('excelInput').click()"
        >
            آپلود اکسل موجودی
        </button>
 
        <button
            class="btn-dark"
            id="refreshBtn"
            onclick="refreshFromDb()"
        >
            بروزرسانی از دیتابیس
        </button>
 
    </section>
 
 
    <!-- LEGEND -->
 
    <div class="legend">
 
        <div class="legend-item">
            <span class="legend-color stock-zero"></span>
            0
        </div>
 
        <div class="legend-item">
            <span class="legend-color stock-low"></span>
            1 تا 9
        </div>
 
        <div class="legend-item">
            <span class="legend-color stock-orange"></span>
            10 تا 20
        </div>
 
        <div class="legend-item">
            <span class="legend-color stock-medium"></span>
            21 تا 30
        </div>
 
        <div class="legend-item">
            <span class="legend-color stock-good"></span>
            بیشتر از 30
        </div>
 
        <div class="legend-item">
            <span class="legend-color stock-nocode"></span>
            بدون کد کالا
        </div>
 
    </div>
 
 
    <!-- TABLES -->
 
    <div id="tablesContainer"></div>
 
 
    <div class="footer">
        انبار مجازی SIC
    </div>
 
</div>
 
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
 
<script>
 
/* =========================================================
   SUPABASE CONFIG
   ========================================================= */
 
const SUPABASE_URL = "https://yxvjpmhypebwucnwwpzh.supabase.co";
const SUPABASE_KEY = "sb_publishable_WTu01Xkvr0LJ5DJcls_hHg_iO8iuAx7";
 
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
 
 
/* =========================================================
   DATA - ساختار لاین‌ها (قطر و طول)
   ========================================================= */
 
const inventory = {
 
    ACE: {
        diameters: [3.4, 4.0, 4.5, 5.0],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    },
 
    MAX: {
        diameters: [3.7, 4.2, 4.7, 5.2],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    },
 
    Tapered: {
        diameters: [3.7, 4.2, 4.7, 5.2],
        lengths: [6, 7.5, 9.5, 11.5, 13],
        stock: {}
    }
 
};
 
 
/* =========================================================
   DATA - نگاشت (لاین، قطر، طول) به کد کالا
   برگرفته از دیتاشیت SIC. مقدار null یعنی برای آن سایز
   کد کالایی تعریف نشده است.
   ========================================================= */
 
const codeDataRaw = [
 
    ["ACE", 3.4, 6, null],    ["ACE", 3.4, 7.5, "935182"], ["ACE", 3.4, 9.5, "935170"], ["ACE", 3.4, 11.5, "935171"], ["ACE", 3.4, 13, "935172"],
    ["ACE", 4.0, 6, "935140"],["ACE", 4.0, 7.5, "935183"], ["ACE", 4.0, 9.5, "935174"], ["ACE", 4.0, 11.5, "935175"], ["ACE", 4.0, 13, "935176"],
    ["ACE", 4.5, 6, "935141"],["ACE", 4.5, 7.5, "935150"], ["ACE", 4.5, 9.5, "935151"], ["ACE", 4.5, 11.5, "935152"], ["ACE", 4.5, 13, "935153"],
    ["ACE", 5.0, 6, "935142"],["ACE", 5.0, 7.5, "935184"], ["ACE", 5.0, 9.5, "935178"], ["ACE", 5.0, 11.5, "935179"], ["ACE", 5.0, 13, "935180"],
 
    ["MAX", 3.7, 6, null],    ["MAX", 3.7, 7.5, "935270"], ["MAX", 3.7, 9.5, "935271"], ["MAX", 3.7, 11.5, "935272"], ["MAX", 3.7, 13, "935273"],
    ["MAX", 4.2, 6, "935265"],["MAX", 4.2, 7.5, "935275"], ["MAX", 4.2, 9.5, "935276"], ["MAX", 4.2, 11.5, "935277"], ["MAX", 4.2, 13, "935278"],
    ["MAX", 4.7, 6, "935266"],["MAX", 4.7, 7.5, "935285"], ["MAX", 4.7, 9.5, "935286"], ["MAX", 4.7, 11.5, "935287"], ["MAX", 4.7, 13, "935288"],
    ["MAX", 5.2, 6, "935267"],["MAX", 5.2, 7.5, "935280"], ["MAX", 5.2, 9.5, "935281"], ["MAX", 5.2, 11.5, "935282"], ["MAX", 5.2, 13, "935283"],
 
    ["Tapered", 3.7, 6, null], ["Tapered", 3.7, 7.5, "935371"], ["Tapered", 3.7, 9.5, "935372"], ["Tapered", 3.7, 11.5, "935373"], ["Tapered", 3.7, 13, "935374"],
    ["Tapered", 4.2, 6, null], ["Tapered", 4.2, 7.5, "935377"], ["Tapered", 4.2, 9.5, "935378"], ["Tapered", 4.2, 11.5, "935379"], ["Tapered", 4.2, 13, "935380"],
    ["Tapered", 4.7, 6, null], ["Tapered", 4.7, 7.5, "935383"], ["Tapered", 4.7, 9.5, "935384"], ["Tapered", 4.7, 11.5, "935385"], ["Tapered", 4.7, 13, "935386"],
    ["Tapered", 5.2, 6, null], ["Tapered", 5.2, 7.5, "935389"], ["Tapered", 5.2, 9.5, "935390"], ["Tapered", 5.2, 11.5, "935391"], ["Tapered", 5.2, 13, "935392"]
 
];
 
const codeMap = {};       // key(line,diameter,length) -> product_code | null
const codeToPosition = {}; // product_code -> {line, diameter, length}
 
codeDataRaw.forEach(([line, diameter, length, code]) => {
 
    const key = createKey(line, diameter, length);
 
    codeMap[key] = code;
 
    if (code) {
        codeToPosition[code] = { line, diameter, length };
    }
 
});
 
 
/* سلول در حال ویرایش */
let editingCell = null;
 
 
/* =========================================================
   KEY
   ========================================================= */
 
function createKey(line, diameter, length) {
 
    return `${line}_${diameter}_${length}`;
 
}
 
 
/* =========================================================
   INITIALIZE
   فقط برای سایزهایی که کد کالا دارند مقدار اولیه صفر
   ساخته می‌شود.
   ========================================================= */
 
function initializeInventory() {
 
    Object.keys(inventory).forEach(line => {
 
        inventory[line].diameters.forEach(diameter => {
 
            inventory[line].lengths.forEach(length => {
 
                const key =
                    createKey(line, diameter, length);
 
                if (codeMap[key]) {
                    inventory[line].stock[key] = 0;
                }
 
            });
 
        });
 
    });
 
}
 
 
/* =========================================================
   STOCK COLOR
   ========================================================= */
 
function getStockClass(stock) {
 
    if (stock === 0) {
        return "stock-zero";
    }
 
    if (stock < 10) {
        return "stock-low";
    }
 
    if (stock <= 20) {
        return "stock-orange";
    }
 
    if (stock <= 30) {
        return "stock-medium";
    }
 
    return "stock-good";
 
}
 
 
/* =========================================================
   RENDER TABLES
   ========================================================= */
 
function renderTables() {
 
    const container =
        document.getElementById("tablesContainer");
 
    container.innerHTML = "";
 
    Object.keys(inventory).forEach(line => {
 
        const data = inventory[line];
 
        const section =
            document.createElement("section");
 
        section.className = "line-section";
 
        section.dataset.line = line;
 
        let rows = "";
 
        data.diameters.forEach(diameter => {
 
            let cells = "";
 
            data.lengths.forEach(length => {
 
                const key =
                    createKey(line, diameter, length);
 
                const code =
                    codeMap[key];
 
                if (!code) {
 
                    /* سلولی که کد کالا برایش تعریف نشده */
 
                    cells += `
 
                        <td
                            class="inventory-cell stock-nocode"
                            data-nocode="1"
                            data-search="${line} ${diameter} ${length}"
                        >
 
                            <div class="nocode-label">
                                بدون کد
                            </div>
 
                        </td>
 
                    `;
 
                    return;
 
                }
 
                const stock =
                    data.stock[key] || 0;
 
                cells += `
 
                    <td
                        class="inventory-cell ${getStockClass(stock)}"
                        data-line="${line}"
                        data-diameter="${diameter}"
                        data-length="${length}"
                        data-code="${code}"
                        data-stock="${stock}"
                        data-search="${line} ${diameter} ${length} ${code}"
                        onclick="startEdit(this)"
                    >
 
                        <div class="stock-number">
                            ${stock}
                        </div>
 
                        <div class="stock-label">
                            عدد
                        </div>
 
                    </td>
 
                `;
 
            });
 
            rows += `
 
                <tr>
 
                    <td class="diameter-cell">
                        ${diameter}
                    </td>
 
                    ${cells}
 
                </tr>
 
            `;
 
        });
 
 
        section.innerHTML = `
 
            <div class="line-header">
 
                <div class="line-title">
 
                    <h2>${line}</h2>
 
                    <span class="line-badge">
                        4 قطر × 5 طول
                    </span>
 
                </div>
 
                <div class="line-total">
 
                    مجموع:
                    <strong id="${line}-total">
                        0
                    </strong>
                    عدد
 
                </div>
 
            </div>
 
 
            <div class="table-scroll">
 
                <table class="inventory-table">
 
                    <thead>
 
                        <tr>
 
                            <th class="diameter-header">
                                قطر / طول
                            </th>
 
                            ${data.lengths.map(length => `
 
                                <th>
                                    ${length}
                                </th>
 
                            `).join("")}
 
                        </tr>
 
                    </thead>
 
                    <tbody>
                        ${rows}
                    </tbody>
 
                </table>
 
            </div>
        `;
 
        container.appendChild(section);
 
    });
 
}
 
 
/* =========================================================
   DIRECT EDIT
   ========================================================= */
 
function startEdit(cell) {
 
    if (editingCell) {
        finishEdit();
    }
 
    editingCell = cell;
 
    const oldValue =
        Number(cell.dataset.stock);
 
    cell.innerHTML = `
 
        <input
            class="stock-input"
            type="number"
            min="0"
            step="1"
            value="${oldValue}"
        >
 
        <div class="edit-hint">
            Enter = ثبت
        </div>
 
    `;
 
    const input =
        cell.querySelector("input");
 
    input.focus();
 
    input.select();
 
 
    input.addEventListener("keydown", function(event) {
 
        if (event.key === "Enter") {
 
            finishEdit();
 
        }
 
        if (event.key === "Escape") {
 
            cancelEdit();
 
        }
 
    });
 
 
    input.addEventListener("blur", function() {
 
        setTimeout(() => {
 
            if (editingCell === cell) {
                finishEdit();
            }
 
        }, 100);
 
    });
 
}
 
 
/* =========================================================
   FINISH EDIT
   ========================================================= */
 
function finishEdit() {
 
    if (!editingCell) {
        return;
    }
 
    const cell =
        editingCell;
 
    const input =
        cell.querySelector("input");
 
    if (!input) {
        editingCell = null;
        return;
    }
 
    let value =
        Number(input.value);
 
    if (!Number.isInteger(value) || value < 0) {
 
        value = 0;
 
    }
 
    const line =
        cell.dataset.line;
 
    const diameter =
        Number(cell.dataset.diameter);
 
    const length =
        Number(cell.dataset.length);
 
    const code =
        cell.dataset.code;
 
    const key =
        createKey(line, diameter, length);
 
    inventory[line].stock[key] =
        value;
 
    cell.dataset.stock =
        value;
 
    cell.className =
        `inventory-cell ${getStockClass(value)}`;
 
    cell.innerHTML = `
 
        <div class="stock-number">
            ${value}
        </div>
 
        <div class="stock-label">
            عدد
        </div>
 
    `;
 
    editingCell = null;
 
    updateSummary();
 
    saveQuantityToDb(code, value);
 
}
 
 
/* =========================================================
   CANCEL EDIT
   ========================================================= */
 
function cancelEdit() {
 
    if (!editingCell) {
        return;
    }
 
    const cell =
        editingCell;
 
    const value =
        Number(cell.dataset.stock);
 
    cell.className =
        `inventory-cell ${getStockClass(value)}`;
 
    cell.innerHTML = `
 
        <div class="stock-number">
            ${value}
        </div>
 
        <div class="stock-label">
            عدد
        </div>
 
    `;
 
    editingCell = null;
 
}
 
 
/* =========================================================
   SUMMARY
   ========================================================= */
 
function updateSummary() {
 
    let total = 0;
 
    let lowCount = 0;
 
    Object.keys(inventory).forEach(line => {
 
        let lineTotal = 0;
 
        Object.values(inventory[line].stock)
            .forEach(stock => {
 
                lineTotal += stock;
 
                total += stock;
 
                if (stock > 0 && stock < 10) {
                    lowCount++;
                }
 
            });
 
 
        const lineTotalEl =
            document.getElementById(`${line}-total`);
 
        if (lineTotalEl) {
            lineTotalEl.textContent =
                lineTotal.toLocaleString("fa-IR");
        }
 
 
        const cardEl =
            document.getElementById(line.toLowerCase() + "Total");
 
        if (cardEl) {
            cardEl.textContent =
                lineTotal.toLocaleString("fa-IR");
        }
 
    });
 
 
    document.getElementById("totalStock")
        .textContent =
        total.toLocaleString("fa-IR");
 
 
    document.getElementById("lowStockCount")
        .textContent =
        lowCount.toLocaleString("fa-IR");
 
}
 
 
/* =========================================================
   LAST UPDATE
   ========================================================= */
 
function updateLastUpdate(date) {
 
    const now =
        date || new Date();
 
    const dateStr =
        now.toLocaleDateString("fa-IR");
 
    const time =
        now.toLocaleTimeString("fa-IR", {
            hour: "2-digit",
            minute: "2-digit"
        });
 
    document.getElementById("lastUpdate")
        .textContent =
        `${dateStr} - ${time}`;
 
}
 
 
/* =========================================================
   CONNECTION STATUS
   ========================================================= */
 
function setConnectionStatus(state) {
 
    const el =
        document.getElementById("connectionStatus");
 
    const textEl =
        document.getElementById("connectionStatusText");
 
    el.classList.remove("connecting", "error");
 
    if (state === "connecting") {
        el.classList.add("connecting");
        textEl.textContent = "در حال اتصال...";
    }
 
    else if (state === "error") {
        el.classList.add("error");
        textEl.textContent = "خطا در اتصال به دیتابیس";
    }
 
    else {
        textEl.textContent = "متصل به دیتابیس";
    }
 
}
 
 
/* =========================================================
   LOAD FROM SUPABASE
   ========================================================= */
 
async function loadFromSupabase() {
 
    setConnectionStatus("connecting");
 
    const { data, error } =
        await sb.from("implant_inventory").select("*");
 
    if (error) {
 
        setConnectionStatus("error");
 
        alert(
            "خطا در دریافت اطلاعات از دیتابیس:\n" +
            error.message
        );
 
        return;
 
    }
 
    setConnectionStatus("ok");
 
    let latest = null;
 
    data.forEach(row => {
 
        const pos =
            codeToPosition[row.product_code];
 
        if (pos) {
 
            const key =
                createKey(pos.line, pos.diameter, pos.length);
 
            inventory[pos.line].stock[key] =
                Number(row.quantity) || 0;
 
        }
 
        if (row.updated_at) {
 
            const t =
                new Date(row.updated_at);
 
            if (!latest || t > latest) {
                latest = t;
            }
 
        }
 
    });
 
    if (latest) {
        updateLastUpdate(latest);
    }
 
}
 
 
/* =========================================================
   SAVE SINGLE QUANTITY (ویرایش دستی یک سلول)
   ========================================================= */
 
async function saveQuantityToDb(productCode, quantity) {
 
    const { error } =
        await sb.from("implant_inventory")
            .update({
                quantity: quantity,
                updated_at: new Date().toISOString()
            })
            .eq("product_code", productCode);
 
    if (error) {
 
        alert(
            "خطا در ذخیره تغییر در دیتابیس:\n" +
            error.message
        );
 
        return;
 
    }
 
    updateLastUpdate();
 
}
 
 
/* =========================================================
   REFRESH BUTTON (به‌روزرسانی دستی از دیتابیس)
   ========================================================= */
 
async function refreshFromDb() {
 
    const btn =
        document.getElementById("refreshBtn");
 
    btn.disabled = true;
 
    btn.textContent = "در حال بروزرسانی...";
 
    await loadFromSupabase();
 
    renderTables();
 
    updateSummary();
 
    btn.disabled = false;
 
    btn.textContent = "بروزرسانی از دیتابیس";
 
}
 
 
/* =========================================================
   FILTER
   ========================================================= */
 
function applyFilters() {
 
    const search =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();
 
 
    const filter =
        document.getElementById("filterSelect")
        .value;
 
 
    document.querySelectorAll(".inventory-cell")
        .forEach(cell => {
 
            if (cell.dataset.nocode === "1") {
 
                const text =
                    (cell.dataset.search || "").toLowerCase();
 
                const searchMatch =
                    !search || text.includes(search);
 
                cell.style.opacity =
                    searchMatch ? "1" : "0.15";
 
                return;
 
            }
 
            const line =
                cell.dataset.line;
 
            const diameter =
                Number(cell.dataset.diameter);
 
            const length =
                Number(cell.dataset.length);
 
            const stock =
                Number(cell.dataset.stock);
 
 
            const text =
                `${line} ${diameter} ${length} ${cell.dataset.code || ""}`
                .toLowerCase();
 
 
            const searchMatch =
                !search ||
                text.includes(search);
 
 
            let filterMatch = true;
 
 
            if (filter === "available") {
                filterMatch = stock > 0;
            }
 
            else if (filter === "zero") {
                filterMatch = stock === 0;
            }
 
            else if (filter === "low") {
                filterMatch =
                    stock > 0 && stock < 10;
            }
 
            else if (filter === "orange") {
                filterMatch =
                    stock >= 10 && stock <= 20;
            }
 
            else if (filter === "medium") {
                filterMatch =
                    stock >= 21 && stock <= 30;
            }
 
            else if (filter === "good") {
                filterMatch =
                    stock > 30;
            }
 
 
            cell.style.opacity =
                searchMatch && filterMatch
                    ? "1"
                    : "0.15";
 
        });
 
}
 
 
/* =========================================================
   RESET FILTER
   ========================================================= */
 
function resetFilters() {
 
    document.getElementById("searchInput")
        .value = "";
 
    document.getElementById("filterSelect")
        .value = "all";
 
 
    document.querySelectorAll(".inventory-cell")
        .forEach(cell => {
 
            cell.style.opacity = "1";
 
        });
 
}
 
 
/* =========================================================
   EXCEL UPLOAD
   ستون اول: کد کالا | ستون دوم: تعداد
   ========================================================= */
 
async function handleExcelFile(event) {
 
    const file =
        event.target.files[0];
 
    if (!file) {
        return;
    }
 
    const uploadBtn =
        document.getElementById("uploadBtn");
 
    uploadBtn.disabled = true;
 
    uploadBtn.textContent = "در حال پردازش...";
 
    try {
 
        const buffer =
            await file.arrayBuffer();
 
        const workbook =
            XLSX.read(buffer);
 
        const sheet =
            workbook.Sheets[workbook.SheetNames[0]];
 
        const rows =
            XLSX.utils.sheet_to_json(sheet, {
                header: 1,
                raw: true,
                defval: ""
            });
 
        const matched = [];
 
        const unmatchedCodes = [];
 
        let invalidRows = 0;
 
        rows.forEach((row, index) => {
 
            if (!row || row.length < 2) {
                return;
            }
 
            const codeRaw = row[0];
 
            const qtyRaw = row[1];
 
            if (codeRaw === "" || codeRaw === null || codeRaw === undefined) {
                return;
            }
 
            /* رد کردن ردیف هدر (وقتی مقادیر عددی نیستند) */
 
            if (index === 0 && (isNaN(Number(codeRaw)) || isNaN(Number(qtyRaw)))) {
                return;
            }
 
            const code =
                String(codeRaw).trim();
 
            const qty =
                Number(qtyRaw);
 
            if (!code || Number.isNaN(qty)) {
                invalidRows++;
                return;
            }
 
            const cleanQty =
                Math.max(0, Math.round(qty));
 
            if (codeToPosition[code]) {
 
                matched.push({
                    product_code: code,
                    quantity: cleanQty
                });
 
            } else {
 
                unmatchedCodes.push(code);
 
            }
 
        });
 
        if (matched.length === 0) {
 
            alert(
                "هیچ کد کالای معتبری در فایل اکسل پیدا نشد.\n\n" +
                "ستون اول باید کد کالا و ستون دوم تعداد باشد."
            );
 
            return;
 
        }
 
        const nowIso =
            new Date().toISOString();
 
        const payload =
            matched.map(m => ({
                product_code: m.product_code,
                quantity: m.quantity,
                updated_at: nowIso
            }));
 
        const { error } =
            await sb.from("implant_inventory")
                .upsert(payload, { onConflict: "product_code" });
 
        if (error) {
 
            alert(
                "خطا در بروزرسانی دیتابیس:\n" +
                error.message
            );
 
            return;
 
        }
 
        await loadFromSupabase();
 
        renderTables();
 
        updateSummary();
 
        let summary =
            `آپلود با موفقیت انجام شد.\n\n` +
            `تعداد کدهای به‌روزشده: ${matched.length.toLocaleString("fa-IR")}`;
 
        if (unmatchedCodes.length) {
            summary +=
                `\nکدهای ناشناخته (نادیده گرفته شد): ${unmatchedCodes.length.toLocaleString("fa-IR")}`;
        }
 
        if (invalidRows) {
            summary +=
                `\nردیف‌های نامعتبر: ${invalidRows.toLocaleString("fa-IR")}`;
        }
 
        alert(summary);
 
    } catch (err) {
 
        alert(
            "خطا در خواندن فایل اکسل:\n" +
            err.message
        );
 
    } finally {
 
        event.target.value = "";
 
        uploadBtn.disabled = false;
 
        uploadBtn.textContent = "آپلود اکسل موجودی";
 
    }
 
}
 
 
/* =========================================================
   START
   ========================================================= */
 
async function start() {
 
    initializeInventory();
 
    renderTables();
 
    updateSummary();
 
    await loadFromSupabase();
 
    renderTables();
 
    updateSummary();
 
}
 
start();
